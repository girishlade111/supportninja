<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <!-- Gray blob background -->
  <circle cx="200" cy="200" r="160" fill="#e5e7eb" />

  <!-- Document icons -->
  <rect x="80" y="110" width="80" height="100" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="4" />
  <line x1="100" y1="140" x2="140" y2="140" stroke="#9ca3af" stroke-width="6" stroke-linecap="round" />
  <line x1="100" y1="160" x2="140" y2="160" stroke="#9ca3af" stroke-width="6" stroke-linecap="round" />
  <line x1="100" y1="180" x2="120" y2="180" stroke="#9ca3af" stroke-width="6" stroke-linecap="round" />

  <rect x="240" y="90" width="70" height="90" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="4" />
  <line x1="260" y1="120" x2="290" y2="120" stroke="#9ca3af" stroke-width="5" stroke-linecap="round" />
  <line x1="260" y1="140" x2="290" y2="140" stroke="#9ca3af" stroke-width="5" stroke-linecap="round" />
  <line x1="260" y1="160" x2="280" y2="160" stroke="#9ca3af" stroke-width="5" stroke-linecap="round" />

  <!-- Chart line -->
  <polyline points="100,250 150,210 200,230 260,170 320,190" stroke="#ef4444" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <circle cx="100" cy="250" r="7" fill="#ef4444" />
  <circle cx="150" cy="210" r="7" fill="#ef4444" />
  <circle cx="200" cy="230" r="7" fill="#ef4444" />
  <circle cx="260" cy="170" r="7" fill="#ef4444" />
  <circle cx="320" cy="190" r="7" fill="#ef4444" />

  <!-- Magnifying glass -->
  <circle cx="260" cy="260" r="50" stroke="#9ca3af" stroke-width="10" fill="none" />
  <line x1="296" y1="296" x2="340" y2="340" stroke="#9ca3af" stroke-width="12" stroke-linecap="round" />

  <!-- Lightbulb -->
  <circle cx="130" cy="270" r="28" fill="#fef08a" />
  <path d="M112,285 C112,285 118,300 130,300 C142,300 148,285 148,285" stroke="#facc15" stroke-width="5" stroke-linecap="round" />
  <line x1="122" y1="302" x2="138" y2="302" stroke="#facc15" stroke-width="5" stroke-linecap="round" />
  <line x1="124" y1="308" x2="136" y2="308" stroke="#facc15" stroke-width="5" stroke-linecap="round" />
</svg>
